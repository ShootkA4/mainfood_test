<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь компании</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#eef1f5;font-size:13px}

/* ===== TOP BAR ===== */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#fff;border-radius:10px;margin-bottom:12px;max-width:1260px;margin-left:auto;margin-right:auto;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.top-bar h1{font-size:22px;font-weight:600;color:#1a1a1a}
.nav{display:flex;gap:6px;align-items:center}
.nav button{padding:6px 14px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.nav button:hover{background:#f0f0f0}
.nav .today-btn{background:#29b6f6;color:#fff;border-color:#29b6f6}
.status-chip{margin-left:12px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-chip.integrated{background:#e8f5e9;color:#2e7d32}
.status-chip.standalone{background:#fff3cd;color:#856404}

/* ===== CALENDAR CARD ===== */
.cal-wrap{max-width:1260px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden}

/* STRIPS - multi-day events above grid */
.strips-area{padding:6px 8px;position:relative;height:32px;min-height:32px}
.strip-row{position:absolute;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);height:22px}
.event-bar{border-radius:3px;display:flex;align-items:center;padding:0 6px;font-size:11px;font-weight:500;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;min-width:20px}
.event-bar:hover{filter:brightness(.9);z-index:5}
.eb-meet{background:#5c9cdf}.eb-task{background:#28a745}.eb-dead{background:#d32f2f}.eb-hol{background:#ffa726}

/* WEEKDAY HEADER */
.week-header{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfc;border-bottom:1px solid #e8e8e8}
.wk{text-align:center;padding:8px;font-size:12px;font-weight:600;color:#777;text-transform:uppercase}

/* DAYS GRID */
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);border-right:1px solid #eee}
.day-cell{min-height:100px;padding:4px 5px;border-right:1px solid #eee;border-bottom:1px solid #eee;position:relative}
.day-cell:nth-child(7n){border-right:none}
.day-cell.other{background:#fafafa}
.day-number{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:600;color:#333}
.day-cell.today .day-number{background:#29b6f6;color:#fff}
.day-cell.other .day-number{color:#bbb}

/* single-day events in cells */
.single-ev{padding:2px 5px;margin-top:2px;border-radius:2px;font-size:11px;font-weight:500;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.se-meet{background:#fff3cd;color:#856404;border-left:2px solid #ffc107}
.se-task{background:#d4edda;color:#155724;border-left:2px solid #28a745}
.se-dead{background:#f8d7da;color:#721c24;border-left:2px solid #d32f2f}
.se-hol{background:#ffe0b2;color:#e65100;border-left:2px solid #ffa726}

.multi-dot{width:7px;height:7px;border-radius:50%;margin-top:2px;cursor:pointer}
.md-meet{background:#5c9cdf}.md-task{background:#28a745}.md-dead{background:#d32f2f}.md-hol{background:#ffa726}

/* LOADING */
.loading{text-align:center;padding:40px;color:#888;font-size:14px}

/* EVENT DETAIL MODAL */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:420px;width:90%}
.modal-title{font-size:18px;font-weight:600;margin-bottom:8px}
.modal-date{color:#777;font-size:13px;margin-bottom:12px}
.modal-desc{font-size:14px;line-height:1.6;color:#555;white-space:pre-wrap}
.close-x{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.open-bx-btn{display:block;margin-top:12px;padding:6px 14px;background:#e8f0fe;color:#1a73e8;border:none;border-radius:6px;cursor:pointer;font-size:12px;width:100%}
.open-bx-btn:hover{background:#d2e3fc}

@media(max-width:700px){
  .top-bar{flex-direction:column;gap:8px;text-align:center}
  .nav{width:100%;justify-content:center}
  .status-chip{margin-left:0;margin-top:6px}
  .day-cell{min-height:70px}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <h1 id="ttl"></h1>
  <div class="nav">
    <button onclick="chg(-1)">&#8592;</button>
    <button class="today-btn" onclick="goToday()">Сегодня</button>
    <button onclick="chg(1)">&#8594;</button>
    <span class="status-chip" id="statusChip">Загрузка...</span>
  </div>
</div>

<!-- CALENDAR -->
<div class="cal-wrap">
  <div class="strips-area" id="stripsArea"></div>
  <div class="week-header">
    <div class="wk">Пн</div><div class="wk">Вт</div><div class="wk">Ср</div>
    <div class="wk">Чт</div><div class="wk">Пт</div><div class="wk">Сб</div><div class="wk">Вс</div>
  </div>
  <div class="days-grid" id="daysGrid"><div class="loading">⏳ Загрузка событий...</div></div>
</div>

<!-- EVENT DETAIL MODAL -->
<div class="overlay" id="ov" onclick="rm(this)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-x" onclick="rm(document.getElementById('ov'))">&times;</button>
    <p class="modal-title" id="mT"></p>
    <p class="modal-date" id="mD"></p>
    <p class="modal-desc" id="mS"></p>
    <button class="open-bx-btn" id="bxOpenBtn" style="display:none" onclick="openInBitrix()">Открыть в Битриксе</button>
  </div>
</div>

<script src="calendar.js"></script>
</body>
</html>
